name: Release Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Policy and integration tests
        run: python -m unittest discover -s tests -v
  clients:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [atlas, beacon, cedar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m quality.run --client ${{ matrix.client }} --out reports/${{ matrix.client }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-${{ matrix.client }}
          path: reports/${{ matrix.client }}/
          if-no-files-found: error
  release:
    needs: [engine, clients]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full release gate (all clients)
        run: python -m quality.run --out reports/release
      - name: Verify regression detection experiment
        run: python -m quality.demo --out reports/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: reports/
          if-no-files-found: error
